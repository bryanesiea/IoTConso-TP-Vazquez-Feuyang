; Configuration PlatformIO utilisée pour tous les codes de ce dépôt.
; Pour tester un code : le copier dans src/main.cpp d'un projet avec ce fichier.
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME680 Library
    marcoschwartz/LiquidCrystal_I2C
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit MQTT Library
